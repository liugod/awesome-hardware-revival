name: Validate catalog and site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/build.py
      - run: python scripts/validate.py
      - run: git diff --exit-code -- docs research/REPORT.zh-CN.md research/DEEP_DIVES.zh-CN.md
